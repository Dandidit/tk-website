<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sticky Navbar Example</title>
  <style>
    /* Reset default margins */
    body {
    margin: 0;
    font-family: sans-serif;
    }

    /* The Sticky Navbar */
    .navbar {
    position: sticky;
    top: 0;               /* Critical: Tells it where to stick */
    z-index: 100;         /* Keeps it on top of overlapping content */
    
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px;
    background-color: #ffffff;
    border-bottom: 1px solid #d3d3d3;
    }

    /* Basic styling for nav layout */
    .nav-links {
    display: flex;
    gap: 20px;
    list-style: none;
    margin: 0;
    padding: 0;
    }

    /* Page content styling */
    .content {
    padding: 32px;
    background-color: #f9f9f9;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div>MySite</div>
    <ul>
      <li>Home</li>
      <li>About</li>
      <li>Contact</li>
    </ul>
</div>

  <main class="content">
    <h1>Scroll Down to Test</h1>
    <p>The navbar will stay fixed at the top of the screen once you pass it.</p>
    <!-- Extra height to force scrolling -->
    <div style="height: 2000px;"></div>
  </main>

</body>
</html>
