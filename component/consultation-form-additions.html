<!-- Add this hidden honeypot inside .consultation-form, near the beginning. -->
<div class="form-field consultation-form__honeypot" aria-hidden="true">
  <label for="website">Leave this field empty</label>
  <input
    id="website"
    name="website"
    type="text"
    tabindex="-1"
    autocomplete="off"
  >
</div>

<!-- Replace your current consent label with this version. -->
<label class="form-consent">
  <input type="checkbox" name="consent" required>
  <span>
    By submitting this form, you agree to receive communications from
    TeraKira and acknowledge our
    <a href="terms-and-conditions.html#pdpa">Terms, Privacy and PDPA Notice</a>.
    We collect your form details to respond to your enquiry. We also process
    your IP address, browser information and submission time for spam
    prevention and security. The IP address and browser information are
    removed after 30 days, and the consultation record is retained for up to
    2 years unless a longer period is legally required.
  </span>
</label>

<!-- Add before the submit button. Replace the site key placeholder. -->
<div
  id="consultation-turnstile"
  class="consultation-form__turnstile"
  data-sitekey="0x4AAAAAAEDA1vBB-_ldZnOy">
</div>

<div
  class="consultation-form__message"
  role="status"
  aria-live="polite"
  hidden>
</div>
