<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | TeraKira</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 40px;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    .auth-card h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .auth-card p {
      margin: 0 0 28px;
    }

    .auth-field {
      margin-bottom: 16px;
    }

    .auth-field label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .auth-field input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font: inherit;
      box-sizing: border-box;
    }

    .auth-submit {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: #111;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .auth-error {
      display: none;
      margin-bottom: 16px;
      padding: 10px;
      border: 1px solid #d33;
      border-radius: 6px;
      color: #a00;
      background: #fff5f5;
    }

    .auth-link {
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="auth-page">
    <section class="auth-card">
      <h1>Create account</h1>
      <p>Create your TeraKira account.</p>

      <div id="register-error" class="auth-error"></div>

      <form id="register-form">

        <div class="auth-field">
          <label for="name">Name</label>
          <input
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            required
          >
        </div>

        <div class="auth-field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
          >
        </div>

        <button id="register-button" class="auth-submit" type="submit">
          Create account
        </button>
      </form>

      <div class="auth-link">
        Already have an account?
        <a href="/login.html">Sign in</a>
      </div>
    </section>
  </main>

  <script>
    window.TERAKIRA_CONFIG = {
      NEON_AUTH_URL: "https://ep-tiny-haze-azrhc4h9.neonauth.c-3.ap-southeast-1.aws.neon.tech/neondb/auth"
    };
  </script>

  <script type="module" src="js/register.js"></script>
</body>
</html>
