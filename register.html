<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | TeraKira</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/auth.css">

</head>

<body class="auth-body">
  <main class="auth-page">
    <a class="auth-logo" href="/" aria-label="TeraKira home"><img src="/assets/logo.png" alt=""><span>TeraKira</span></a>
    <section class="auth-card">
      <h1>Create your account</h1>
      <p class="auth-sub">Get started with TeraKira in under a minute.</p>

      <div id="register-error" class="auth-error" role="alert"></div>
      <div id="register-notice" class="auth-notice" role="status"></div>

      <form id="register-form" novalidate>
        <div class="auth-field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Jane Tan" required autofocus>
          <p class="field-hint" id="name-hint"></p>
        </div>

        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
          <p class="field-hint" id="email-hint"></p>
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
            <button class="pw-toggle" type="button" aria-label="Show or hide password" aria-pressed="false">Show</button>
          </div>
        </div>
        <div class="auth-field" style="margin-top:-8px">
          <div class="strength" id="strength" data-level="0"><i></i><i></i><i></i><i></i></div>
          <p class="field-hint" id="password-hint">At least 8 characters. Mix letters, numbers and symbols.</p>
        </div>

        <div class="auth-field">
          <label for="confirm">Confirm password</label>
          <div class="pw-wrap">
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
            <button class="pw-toggle" type="button" aria-label="Show or hide password" aria-pressed="false">Show</button>
          </div>
        </div>
        <p class="field-hint" id="confirm-hint" style="margin:-10px 0 16px"></p>

        <button id="register-button" class="auth-submit" type="submit">Create account</button>
        <p class="auth-fine">By creating an account you agree to our <a href="/terms-and-conditions.html" target="_blank" rel="noopener">Terms &amp; Conditions</a>.</p>
      </form>

      <div class="auth-link">
        Already have an account?
        <a href="/login.html">Sign in</a>
      </div>
    </section>
  </main>

  <script>
    window.TERAKIRA_CONFIG = {
      NEON_AUTH_URL: "https://ep-tiny-haze-azrhc4h9.neonauth.c-3.ap-southeast-1.aws.neon.tech/neondb/auth"
    };
  </script>

  <script type="module" src="js/auth-ui.js"></script>
  <script type="module" src="js/register.js"></script>
</body>
</html>
