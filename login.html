<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | TeraKira</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-body">
  <main class="auth-page">
    <a class="auth-logo" href="/" aria-label="TeraKira home"><img src="/assets/logo.png" alt=""><span>TeraKira</span></a>
    <section class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-sub">Sign in to your TeraKira account.</p>

      <div id="login-error" class="auth-error" role="alert"></div>

      <form id="login-form">
        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required autofocus>
        </div>

        <div class="auth-field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="pw-toggle" type="button" aria-label="Show or hide password" aria-pressed="false">Show</button>
          </div>
        </div>

        <button id="login-button" class="auth-submit" type="submit">Sign in</button>
      </form>
      <div class="auth-link">
        Don't have an account?
        <a href="/register.html">Create account</a>
      </div>
    </section>
  </main>

  <script>
    window.TERAKIRA_CONFIG = {
      NEON_AUTH_URL: "https://ep-tiny-haze-azrhc4h9.neonauth.c-3.ap-southeast-1.aws.neon.tech/neondb/auth"
    };
  </script>

  <script type="module" src="js/auth-ui.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
